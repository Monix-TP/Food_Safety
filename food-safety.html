@media(max-width:600px){#hud{font-size:12px;gap:5px;padding:6px}}

.b,.opt{min-height:52px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.opt{font-size:16px}
#hb{min-height:44px}.pn{max-height:88dvh}

#ui.sheet{align-items:flex-end;background:rgba(4,10,22,.2)}.pn.fbk{padding:14px 16px;border-top:3px solid var(--teal);line-height:1.7}
.gb{text-align:right;border-right:6px solid var(--teal)}.gb small{margin-top:2px}
@media(max-width:600px){#hud{font-size:12px}}
</style></head><body>
